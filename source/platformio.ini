[platformio]
default_envs = release_azDeliveryDevKitV4

[env]
platform = espressif32@6.9.0
framework = arduino
; platform_packages = framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#2.0.9
monitor_speed = 115200
extra_scripts = pre:extraScript.py
custom_prog_name = GALAGINO PLUS S3
custom_prog_version = V1.0.0
board_build.arduino.partitions = partitions.csv
board_build.f_flash = 80000000L
board_build.flash_mode = qio
build_unflags = -fno-rtti
 
build_flags =
    -D ARDUINO_RUNNING_CORE=0   ;default is 1
    -D BUILD_ENV_NAME=$PIOENV

build_src_flags =
    -Wunknown-pragmas

[env:release_azDeliveryDevKitV4]
board = esp32-s3-devkitc-1-n16r8v
build_type = release
monitor_raw = yes
lib_deps =
build_flags = ${env.build_flags}
    -D TFT_SPICLK=40000000
    -D CORE_DEBUG_LEVEL=0

[env:debug_azDeliveryDevKitV4]
board = esp32-s3-devkitc-1-n16r8v
build_type = debug
monitor_filters = esp32_exception_decoder
lib_deps =
build_flags = ${env.build_flags}
    -D TFT_SPICLK=40000000

[env:release_Nintendo]
board = esp32-s3-devkitc-1-n16r8v
build_type = release
monitor_raw = yes
lib_deps =
    https://github.com/dmadison/NintendoExtensionCtrl
build_flags = ${env.build_flags}
    -D TFT_SPICLK=40000000
    -D NUNCHUCK_INPUT
    -D CORE_DEBUG_LEVEL=0

